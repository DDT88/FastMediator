name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*' # Attivato quando viene creato un tag che inizia con 'v'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Importante per ottenere tutti i tag e commit
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Test
      run: dotnet test --no-restore --verbosity normal
    
    - name: Package
      run: dotnet pack ./FastMediator/FastMediator.csproj -c Release --no-build -o ./artifacts
    
    - name: Push to NuGet
      run: dotnet nuget push ./artifacts/FastMediator.*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate